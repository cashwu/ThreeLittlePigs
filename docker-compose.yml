services:
  ant-grasshopper-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ant-grasshopper-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      TZ: Asia/Taipei
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - ant-grasshopper-network

networks:
  ant-grasshopper-network:
    name: ant-grasshopper-network
    driver: bridge
