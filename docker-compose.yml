services:
  little-work-plane-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: little-work-plane-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      TZ: Asia/Taipei
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - little-work-plane-network

networks:
  little-work-plane-network:
    name: little-work-plane-network
    driver: bridge
